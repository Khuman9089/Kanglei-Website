<!DOCTYPE html>
<html>
<head>
  <base href="/astroai/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jyoti AI — Your Personal Celestial Intelligence. Global Autonomous Astrological Platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jyoti AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Jyoti AI — Your Personal Celestial Intelligence</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07090E;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #jyoti-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .astral-orb {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366F1, #A855F7);
      box-shadow: 0 0 32px rgba(99, 102, 241, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #F8FAFC;
    }
    .brand-sub {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #64748B;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(0.95);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 45px rgba(168, 85, 247, 0.7);
      }
    }
  </style>
</head>
<body>
  <div id="jyoti-loader">
    <div class="astral-orb"></div>
    <div style="text-align: center;">
      <div class="brand-title">Jyoti AI</div>
      <div class="brand-sub">Celestial Intelligence</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
