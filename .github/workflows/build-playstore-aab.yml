name: Build Play Store Android App (AAB & APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/suryasiddha/**'
      - 'SuryaSiddha/**'
      - 'android-twa/**'
      - '.github/workflows/build-playstore-aab.yml'

jobs:
  build-playstore-bundle:
    name: Generate Google Play Store AAB & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle Web Assets into Android App
        run: |
          mkdir -p android-twa/app/src/main/assets
          cp -r public/suryasiddha/* android-twa/app/src/main/assets/

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkey -v -keystore android-twa/app/android.keystore \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=SuryaSiddha, OU=KangleiAstro, O=KuthiYengpham, L=Imphal, S=Manipur, C=IN"

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android App Bundle (AAB) & Release APK
        working-directory: android-twa
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect & Organize Artifacts
        run: |
          mkdir -p build-output
          find android-twa/app/build/outputs/bundle/release -name "*.aab" -exec cp {} build-output/SuryaSiddha-Release.aab \; || true
          find android-twa/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-output/SuryaSiddha-Release.apk \; || true
          ls -la build-output/

      - name: Upload Google Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SuryaSiddha-PlayStore-AAB
          path: build-output/SuryaSiddha-Release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK (For Direct Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: SuryaSiddha-Release-APK
          path: build-output/SuryaSiddha-Release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Print Build Success
        run: |
          echo "========================================================="
          echo "  SuryaSiddha Google Play Store Package Build Complete!  "
          echo "  - Package Name: in.kuthiyengpham.suryasiddha            "
          echo "  - 100% Self-contained Native Standalone Android App     "
          echo "  - Ready for Google Play Console Upload!                "
          echo "========================================================="
