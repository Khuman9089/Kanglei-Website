name: Daily Rashifal & Facebook Auto-Post

on:
  schedule:
    # 00:30 UTC = 6:00 AM Indian Standard Time (IST) every day
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  post-daily-rashifal:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Rashifal & Facebook Auto-Post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'kuthiyengpham_rashifal_cron_secure_2026' }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://kuthiyengpham.in' }}
        run: |
          echo "Triggering KuthiYengpham Daily Rashifal automation..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${SITE_URL}/api/cron/daily-rashifal" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Cron trigger failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Daily Rashifal generated and published successfully!"
